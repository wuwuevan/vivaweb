{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width:520px">
  <div class="card border-0 shadow-soft p-4">
    <h3>Sign in to AI Viva</h3>
    <p class="text-secondary small">Demo account: demo@student.com / demo123</p>
    <form method="post" class="row g-3">
      <div class="col-12"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required></div>
      <div class="col-12"><label class="form-label">Password</label><input class="form-control" name="password" type="password" required></div>
      <div class="col-12"><button class="btn btn-primary w-100">Login</button></div>
      <div class="col-12 text-center"><a href="{{ url_for('register') }}">Create account</a></div>
    </form>
  </div>
</div>
{% endblock %}
