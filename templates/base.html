<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or app_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold text-primary" href="{{ url_for('home') }}"><i class="bi bi-mortarboard-fill me-2"></i>AI Viva</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ms-auto gap-2">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('student_dashboard') }}">Student</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('faculty_dashboard') }}">Faculty</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
        <li class="nav-item"><a class="btn btn-primary btn-sm px-3" href="{{ url_for('student_setup') }}">Start New Viva</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="py-4">
  {% block content %}{% endblock %}
</main>
<footer class="border-top py-4 bg-white">
  <div class="container d-flex flex-column flex-md-row justify-content-between text-muted small">
    <span>© 2026 AI Viva · University Oral Assessment Prototype</span>
    <span>Mock AI behaviors · Frontend-first demonstration</span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
